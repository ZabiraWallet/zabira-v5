[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://rpc.botchain.ai https://bsc-dataseed.binance.org https://bsc-rpc.publicnode.com https://ethereum-rpc.publicnode.com https://cloudflare-eth.com https://rpc.bohr.life https://api.coingecko.com https://dex-wallet.botchain.ai; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
